<svg id="kinh" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 574px;" viewBox="4 4 574 190" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#kinh{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#kinh .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#kinh .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#kinh .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#kinh .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#kinh .edge-thickness-normal{stroke-width:1px;}#kinh .edge-thickness-thick{stroke-width:3.5px;}#kinh .edge-pattern-solid{stroke-dasharray:0;}#kinh .edge-thickness-invisible{stroke-width:0;fill:none;}#kinh .edge-pattern-dashed{stroke-dasharray:3;}#kinh .edge-pattern-dotted{stroke-dasharray:2;}#kinh .marker{fill:#0b0b0b;stroke:#0b0b0b;}#kinh .marker.cross{stroke:#0b0b0b;}#kinh svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#kinh p{margin:0;}#kinh .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#kinh .cluster-label text{fill:rgb(8.5000000002, 5.7500000001, 0);}#kinh .cluster-label span{color:rgb(8.5000000002, 5.7500000001, 0);}#kinh .cluster-label span p{background-color:transparent;}#kinh .label text,#kinh span{fill:#333;color:#333;}#kinh .node rect,#kinh .node circle,#kinh .node ellipse,#kinh .node polygon,#kinh .node path{fill:#fff4dd;stroke:hsl(40.5882352941, 60%, 83.3333333333%);stroke-width:1px;}#kinh .rough-node .label text,#kinh .node .label text,#kinh .image-shape .label,#kinh .icon-shape .label{text-anchor:middle;}#kinh .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#kinh .rough-node .label,#kinh .node .label,#kinh .image-shape .label,#kinh .icon-shape .label{text-align:center;}#kinh .node.clickable{cursor:pointer;}#kinh .root .anchor path{fill:#0b0b0b!important;stroke-width:0;stroke:#0b0b0b;}#kinh .arrowheadPath{fill:#0b0b0b;}#kinh .edgePaths .path{stroke:#0b0b0b;stroke-width:1px;}#kinh .flowchart-link{stroke:#0b0b0b;fill:none;}#kinh .edgeLabel{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);text-align:center;}#kinh .edgeLabel p{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);}#kinh .edgeLabel rect{opacity:0.5;background-color:hsl(-79.4117647059, 100%, 93.3333333333%);fill:hsl(-79.4117647059, 100%, 93.3333333333%);}#kinh .labelBkg{background-color:rgba(243.9999999999, 220.9999999998, 255, 0.5);}#kinh .cluster rect{fill:hsl(220.5882352941, 100%, 98.3333333333%);stroke:hsl(220.5882352941, 60%, 88.3333333333%);stroke-width:1px;}#kinh .cluster text{fill:rgb(8.5000000002, 5.7500000001, 0);}#kinh .cluster span{color:rgb(8.5000000002, 5.7500000001, 0);}#kinh .node .collapsed-indicator{fill:hsl(220.5882352941, 60%, 88.3333333333%);stroke:none;opacity:0.6;}#kinh .node .collapsed-separator{stroke:hsl(220.5882352941, 60%, 88.3333333333%);stroke-width:0.75px;}#kinh div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(220.5882352941, 100%, 98.3333333333%);border:1px solid hsl(220.5882352941, 60%, 88.3333333333%);border-radius:2px;pointer-events:none;z-index:100;}#kinh .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#kinh rect.text{fill:none;stroke-width:0;}#kinh .icon-shape,#kinh .image-shape{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);text-align:center;}#kinh .icon-shape p,#kinh .image-shape p{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);padding:2px;}#kinh .icon-shape .label rect,#kinh .image-shape .label rect{opacity:0.5;background-color:hsl(-79.4117647059, 100%, 93.3333333333%);f