<svg id="kins" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" style="max-width: 569px;" viewBox="4 4 569 185" role="graphics-document document" aria-roledescription="flowchart-v2"><style>#kins{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#kins .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#kins .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#kins .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#kins .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#kins .edge-thickness-normal{stroke-width:1px;}#kins .edge-thickness-thick{stroke-width:3.5px;}#kins .edge-pattern-solid{stroke-dasharray:0;}#kins .edge-thickness-invisible{stroke-width:0;fill:none;}#kins .edge-pattern-dashed{stroke-dasharray:3;}#kins .edge-pattern-dotted{stroke-dasharray:2;}#kins .marker{fill:#0b0b0b;stroke:#0b0b0b;}#kins .marker.cross{stroke:#0b0b0b;}#kins svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#kins p{margin:0;}#kins .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#kins .cluster-label text{fill:rgb(8.5000000002, 5.7500000001, 0);}#kins .cluster-label span{color:rgb(8.5000000002, 5.7500000001, 0);}#kins .cluster-label span p{background-color:transparent;}#kins .label text,#kins span{fill:#333;color:#333;}#kins .node rect,#kins .node circle,#kins .node ellipse,#kins .node polygon,#kins .node path{fill:#fff4dd;stroke:hsl(40.5882352941, 60%, 83.3333333333%);stroke-width:1px;}#kins .rough-node .label text,#kins .node .label text,#kins .image-shape .label,#kins .icon-shape .label{text-anchor:middle;}#kins .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#kins .rough-node .label,#kins .node .label,#kins .image-shape .label,#kins .icon-shape .label{text-align:center;}#kins .node.clickable{cursor:pointer;}#kins .root .anchor path{fill:#0b0b0b!important;stroke-width:0;stroke:#0b0b0b;}#kins .arrowheadPath{fill:#0b0b0b;}#kins .edgePaths .path{stroke:#0b0b0b;stroke-width:1px;}#kins .flowchart-link{stroke:#0b0b0b;fill:none;}#kins .edgeLabel{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);text-align:center;}#kins .edgeLabel p{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);}#kins .edgeLabel rect{opacity:0.5;background-color:hsl(-79.4117647059, 100%, 93.3333333333%);fill:hsl(-79.4117647059, 100%, 93.3333333333%);}#kins .labelBkg{background-color:rgba(243.9999999999, 220.9999999998, 255, 0.5);}#kins .cluster rect{fill:hsl(220.5882352941, 100%, 98.3333333333%);stroke:hsl(220.5882352941, 60%, 88.3333333333%);stroke-width:1px;}#kins .cluster text{fill:rgb(8.5000000002, 5.7500000001, 0);}#kins .cluster span{color:rgb(8.5000000002, 5.7500000001, 0);}#kins .node .collapsed-indicator{fill:hsl(220.5882352941, 60%, 88.3333333333%);stroke:none;opacity:0.6;}#kins .node .collapsed-separator{stroke:hsl(220.5882352941, 60%, 88.3333333333%);stroke-width:0.75px;}#kins div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:12px;background:hsl(220.5882352941, 100%, 98.3333333333%);border:1px solid hsl(220.5882352941, 60%, 88.3333333333%);border-radius:2px;pointer-events:none;z-index:100;}#kins .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#kins rect.text{fill:none;stroke-width:0;}#kins .icon-shape,#kins .image-shape{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);text-align:center;}#kins .icon-shape p,#kins .image-shape p{background-color:hsl(-79.4117647059, 100%, 93.3333333333%);padding:2px;}#kins .icon-shape .label rect,#kins .image-shape .label rect{opacity:0.5;background-color:hsl(-79.4117647059, 100%, 93.3333333333%);fill:hsl(-79.4117647059, 100%, 93.3333333333%);}#kins .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#kins .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#kins .node .neo-node{stroke:hsl(40.5882352941, 60%, 83.3333333333%);}#kins [data-look="neo"].node rect,#kins [data-look="neo"].cluster rect,#kins [data-look="neo"].node polygon{stroke:url(#kins-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kins [data-look="neo"].swimlane.cluster rect{filter:none;}#kins [data-look="neo"].node path{stroke:url(#kins-gradient);stroke-width:1px;}#kins [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kins [data-look="neo"].node .neo-line path{stroke:hsl(40.5882352941, 60%, 83.3333333333%);filter:none;}#kins [data-look="neo"].node circle{stroke:url(#kins-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kins [data-look="neo"].node circle .state-start{fill:#000000;}#kins [data-look="neo"].icon-shape .icon{fill:url(#kins-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kins [data-look="neo"].icon-shape .icon-neo path{stroke:url(#kins-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#kins :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g><marker id="kins_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="kins_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"></path></marker><marker id="kins_flowchart-v2-pointEnd-margin" class="m