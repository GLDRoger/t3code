unlisted:
  "web:team": Old address; opens the Settings modal on Team.
  "web:memory": Old address; opens the Settings modal on Memory.
  "web:settings/approvals": The app's old address; opens Kin's Settings → Approvals.
  "web:settings/company": The app's old address; opens Kin's Settings → Company details.
  "web:settings/check-ins": The app's old address; opens Kin's Settings → Check-ins.
  "web:settings/kin-connections": The app's old address; opens Kin's Settings → Connections.
  "web:settings/deals": The app's settings address for Deals; opens Kin's Settings → Deals.
  "web:settings/sections": The app's settings address for Sections; opens Kin's Settings → Sections.
  "web:settings/kin-profile": Where app Settings search lands for quiet hours, working hours, away and GitHub username; opens Kin's Settings → Profile.
  "web:?v": Picks the version of the open doc; not a screen.
  "web:?tab": Switches the Clients place between its Clients, Deals and Projects lists; not a screen.
  "web:?person": Starts Tasks narrowed to what one person holds, from their page's See all in Tasks; not a screen.
  "web:?section": Scrolls the open doc to a section; not a screen.
  "web:?from": The base version of the compare view (`?changes`); not a screen.
  "rpc:kin.lead.access.list": Served; no client shows an agent's access grants yet.
  "rpc:kin.lead.access.grant": Served; no client grants an agent access yet.
  "rpc:kin.lead.access.revoke": Served; no client revokes an agent's access yet.
  "rpc:kin.approvals.list": Deprecated; always answers unavailable, and no client ever called it (clients read approvals one at a time, kin.approvals.get). Kept until no supported build predates its deprecation.
  "rpc:kin.audit.list": Served; no client shows the audit log yet.
  "rpc:kin.audit.verify": Served; no client checks the audit log yet.
  "rpc:kin.levels.get": Served; no client shows levels yet.
  "rpc:kin.levels.lower": Served; no client changes levels yet.
  "rpc:kin.levels.raise": Served; no client changes levels yet.
  "rpc:kin.docs.clearRecipeLabel": Served; no client clears a recipe's label yet.
  "rpc:kin.work.statementPasswords": Served; no client manages statement passwords yet.
  "rpc:kin.work.statementForgetAccount": Served; no client forgets a statement account yet.
  "rpc:kin.people.setOwnerName": Called by the kin-verify seed (scripts/kin-verify/seed.ts); no client calls it.
  "rpc:kin.refreshes.announce": Called by the host CLI (apps/server/src/kin/cli/announce.ts) from the owner's session.
  "rpc:kin.open.read": Served; no client reads the open list (Needs you and Tasks use their own reads).
  "rpc:kin.open.subscribe": Served; no host lists "open" in its streams, so no client follows it.
