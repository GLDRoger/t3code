    note: >-
      Each agent's character is a private company doc it owns (Docs, owner level). The owner changes
      it by telling the agent in its chat, or from the host with `kin lead character`; its history
      brings back an older one. Other people's turns carry only its voice. "Undo it" in the owner's
      chat shows the agent what it changed lately, so it can put it back.
    tools: [doc_edit, doc_restore, record_update, record_assign]
    proof:
      - apps/server/src/kin/lead/LeadPrompt.test.ts
