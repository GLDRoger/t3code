      them through `/kin/you/mcp`: it reads what their own screens show them and does what those
      screens let them do, through the same service methods, and every write is marked as from their
      coding agent. It can tick and hand back tasks, nudge holders, hand over open tasks, add entry
      links, pin a project note, restore document versions, undo a shareable memory change, read
      budgets, restart watches and save goals using the app's permissions. It sends the person's words to their agents in their own direct chats (marked as
      from their coding agent, never counted as their own word, answering nothing), and no agent's
      reply comes back through the key. Anything a person marked private, and everything under a
      private client or project, stays in Kin for every key. A tool whose section is off or whose
      switch the person lacks is not listed. Answering cards, money or mail leaving the company,
      people and access, connections and keys, the host and settings, and deleting or archiving have
      no tool, and the repository refuses any key-marked write that drops anything or touches a
      money list but making an invoice draft: the server's MCP instructions say so. The key shows
      once; the address and the setup lines, with the key left to fill, stay on their own section.
      At most three live keys, 30 days each. Settings → Profile on the web shows the same section.
    proof:
      - packages/client-runtime/src/kin/kinTasksKeys.test.ts
      - apps/web/src/kin/KinTasksKeys.browser.test.tsx
      - apps/server/src/kin/tasksKey/TasksKeys.test.ts
      - apps/server/src/kin/tasksKey/mcp.test.ts
      - apps/server/src/kin/tasksKey/reads.test.ts

  - id: teammate-coding-agent-keys
    name: See and remove a teammate's coding agent keys
    tab: settings
    web: [home, sheet:Profile, section:Coding agent keys]
    roles: { owner: web, co_owner: web, lead: none, member: none }
    note: >-
      Read and Remove only; nobody makes a key for someone else. The host lets a co-owner remove a
      member's keys but not the owner's or another co-owner's, and removing access ends them all.
    proof:
      - apps/server/src/kin/tasksKey/TasksKeys.test.ts
      - apps/server/src/kin/people/KinPeople.test.ts

