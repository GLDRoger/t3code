# Kin's features: where each lives, how each role reaches it on web and phone, which agent tools
# serve it, and what proves it. featureMap.test.ts holds this file to the code:
#   - every web route and pane, phone screen and agent tool belongs to a feature (or `unlisted`);
#   - every Kin RPC is named by a web, phone or client-runtime file, or is `unlisted` with why;
#   - a lead reaches at least what a member reaches;
#   - every proof file exists (`proof: none` is allowed and counted);
#   - paths keep the owner's rule: list → record, forms are sheets, at most three levels past
#     where you start, never a page opened from a sheet. A path that breaks it says why.
# Render it with `node apps/server/scripts/kin-feature-map.ts <out.md>`.
#
# web steps: a route (`tasks`, `chat`, `settings/check-ins`), a pane (`?client`; `?task` and
#   `?history` open as sheets), `sheet:` or `dialog:` <title>, or inline `menu:`, `card:`,
#   `section:`, `button:` <label>, which add no depth.
# phone steps: `tab:<dock tab>` or a first screen, then KIN_SCREENS names, plus the same inline steps.
#   Settings paths start at `SettingsKin`: the owner's dock is five tabs, and Settings is the gear
#   on Chats, so it starts its own paths as a tab does (dock tab → list → record → sheet).
# roles: owner, co_owner, lead (a member who leads a project), member; each `both`, `web`,
#   `phone` or `none`. A role's reach follows what the host allows, not only what the client shows.

features:
